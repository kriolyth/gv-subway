name: Rust

on:
  push:
    branches: [ corpus ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Generate build version
      id: num-commits
      run: echo "GIT_NUM_COMMITS=$(git rev-list --count HEAD)" >> $GITHUB_ENV
    - name: Get wasm-pack    
      uses: jetli/wasm-pack-action@v0.4.0
    - name: Build
      run: wasm-pack build --release
    - name: Build web
      run: cd www && npm ci && npm run build
    - name: Publish
      uses: JamesIves/github-pages-deploy-action@v4.7.0
      with:
        folder: www/dist
        branch: gh-pages
