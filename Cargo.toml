[package]
name = "gv-subway"
version = "0.2.0"
authors = ["Krio Lyth <kriolyth@gmail.com>"]
edition = "2024"
description = "Godville dungeon explorer"
license = "Apache-2.0"
repository = "https://github.com/kriolyth/gv-subway"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
nalgebra = "0.32.6"
js-sys = "0.3"
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }
num-rational = {version="0.4.1", features=["std"], default-features = false}
bitvec = { version="^1", default-features=false, features=["std","alloc"] }
bincode = "2.0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
jiro_nn = {version = "0.8.1", default-features = false, features = ["nalgebra"]}
image = { version = "0.25" }

[profile.release]
panic = "abort"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--flexible-inline-max-function-size", "360", "--fast-math", "--reorder-functions", "--precompute", "--precompute-propagate"]
